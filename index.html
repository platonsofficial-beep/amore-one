<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/one-mark.svg" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="description" content="ONE workforce operations for restaurants and venues" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Web-app markup is added per platform. On iOS/iPadOS 26+ any site added to
      the Home Screen opens as a web app without it, and a manifest or the
      black-translucent status bar puts iOS on a legacy path whose page ends
      ~62pt above the bottom of the glass (WebKit bug 313800). So iOS 26+ gets
      none of it; older iOS keeps the classic tags; everyone else gets the manifest.
    -->
    <script>
      (function () {
        var ua = navigator.userAgent
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
        var v = /Version\/(\d+)/.exec(ua)
        var ios26 = ios && v && Number(v[1]) >= 26
        if (ios26) return
        var head = document.head
        var add = function (tag, attrs) {
          var el = document.createElement(tag)
          for (var k in attrs) el.setAttribute(k, attrs[k])
          head.appendChild(el)
        }
        add('link', { rel: 'manifest', href: '/manifest.webmanifest' })
        if (ios) {
          add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' })
          add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' })
          add('meta', { name: 'apple-mobile-web-app-title', content: 'ONE' })
        }
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>ONE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
